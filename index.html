<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Project</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #e5ddd5; }
        /* Шапка с вводом имени */
        .header { background: #075e54; color: white; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .header input { flex: 1; padding: 5px; border-radius: 5px; border: none; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 5px; }
        
        .msg { background: white; padding: 8px 12px; border-radius: 10px; max-width: 70%; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg span { display: block; font-size: 0.7em; color: #888; margin-bottom: 3px; }
        
        /* Стиль для твоих сообщений */
        .my-msg { background: #dcf8c6; align-self: flex-end; }
        
        .input-area { padding: 10px; background: #f0f0f0; display: flex; }
        .input-area input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { margin-left: 10px; padding: 10px 15px; border: none; background: #075e54; color: white; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <span>Твой ник:</span>
    <input type="text" id="userName" value="Канюх"> <!-- По умолчанию твой ник -->
</div>

<div id="messages"></div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off">
    <button onclick="sendMessage()">➤</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Твои ключи из Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyA8CqQMcIPPUezDmc4QOzdW3AdwW0-EdfE",
        authDomain: "chg1realese.firebaseapp.com",
        databaseURL: "https://chg1realese-default-rtdb.firebaseio.com",
        projectId: "chg1realese",
        storageBucket: "chg1realese.firebasestorage.app",
        messagingSenderId: "1073070552152",
        appId: "1:1073070552152:web:ac76a82ca5599af09d462d",
        measurementId: "G-XCBNPBSJ28"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("multi_user_chat");

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const nameInput = document.getElementById('userName');
        
        if (input.value.trim() !== "") {
            db.push().set({
                text: input.value,
                user: nameInput.value,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    db.on("child_added", (snapshot) => {
        const data = snapshot.val();
        const myCurrentName = document.getElementById('userName').value;
        const messagesDiv = document.getElementById("messages");
        
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");
        
        // Если имя отправителя совпадает с твоим — двигаем вправо
        if (data.user === myCurrentName) {
            msgDiv.classList.add("my-msg");
        }
        
        msgDiv.innerHTML = `<span>${data.user}</span>${data.text}`;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
